name: Deploy Pages
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.pages-deploy.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Apply
        env:
          AA8C98: ${{ secrets.AA8C98 }}
          B9F7B7: ${{ secrets.B9F7B7 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('AA8C98', '')
          bm = os.environ.get('B9F7B7', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- ee9fa2c0e77c9e997404f8 -->', gm)
          if bm:
              s2 = s2.replace('<!-- c0e3e587d31a3d36e1c49bf6dd348992c8c09adf6c9538 -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: pages-deploy
        uses: actions/deploy-pages@v4
